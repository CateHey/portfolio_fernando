<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f4d"/>
      <stop offset="0.6" stop-color="#081430"/>
      <stop offset="1" stop-color="#050a1a"/>
    </linearGradient>
    <linearGradient id="pulp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a85"/>
      <stop offset="1" stop-color="#0b1838"/>
    </linearGradient>
    <linearGradient id="froth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset="1" stop-color="#f5a85a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tank"><path d="M90 110 H350 V330 L300 380 H140 L90 330 Z"/></clipPath>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#6c96ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="220" cy="250" r="200" fill="url(#glow)"/>

  <!-- flotation cell -->
  <g clip-path="url(#tank)">
    <rect x="80" y="100" width="280" height="300" fill="url(#pulp)"/>
    <!-- froth layer -->
    <path d="M80 150 Q110 128 140 150 T200 150 T260 150 T320 150 T380 150 V100 H80 Z" fill="url(#froth)" fill-opacity="0.9"/>
    <g fill="#ffe7bd" fill-opacity="0.9">
      <circle cx="110" cy="132" r="9"/><circle cx="150" cy="124" r="11"/><circle cx="195" cy="134" r="8"/>
      <circle cx="240" cy="122" r="12"/><circle cx="285" cy="132" r="9"/><circle cx="325" cy="124" r="10"/>
    </g>
    <!-- rising air bubbles -->
    <g fill="none" stroke="#9fd9ff" stroke-width="2">
      <circle cx="130" cy="330" r="7"/><circle cx="150" cy="270" r="9"/><circle cx="125" cy="210" r="6"/>
      <circle cx="210" cy="345" r="8"/><circle cx="230" cy="290" r="6"/><circle cx="205" cy="230" r="10"/><circle cx="225" cy="180" r="7"/>
      <circle cx="300" cy="320" r="9"/><circle cx="280" cy="255" r="7"/><circle cx="310" cy="200" r="8"/>
    </g>
    <!-- impeller -->
    <line x1="220" y1="60" x2="220" y2="330" stroke="#dbe8ff" stroke-width="4"/>
    <g fill="#dbe8ff"><rect x="190" y="326" width="60" height="10" rx="3"/><rect x="215" y="312" width="10" height="38" rx="3"/></g>
  </g>
  <path d="M90 110 H350 V330 L300 380 H140 L90 330 Z" fill="none" stroke="#6cc7ff" stroke-width="3"/>
  <!-- froth overflow lip -->
  <path d="M350 130 L390 160 V190" fill="none" stroke="#f5a85a" stroke-width="3" stroke-linecap="round"/>
  <!-- air inlet -->
  <path d="M40 360 H140" stroke="#9fd9ff" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="34" y="392" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#9fd9ff" letter-spacing="1">AIR FLOW</text>

  <!-- instruments -->
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1">
    <circle cx="370" cy="250" r="16" fill="#0b1631" stroke="#6cc7ff" stroke-width="2"/><text x="360" y="254" fill="#6cc7ff">pH</text>
    <circle cx="370" cy="310" r="16" fill="#0b1631" stroke="#9b8cff" stroke-width="2"/><text x="361" y="314" fill="#9b8cff">LT</text>
    <circle cx="70" cy="200" r="16" fill="#0b1631" stroke="#5ee0d0" stroke-width="2"/><text x="61" y="204" fill="#5ee0d0">FT</text>
  </g>
  <g fill="none" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M386 250 C440 250 450 200 490 200" stroke="#6cc7ff"/>
    <path d="M386 310 C450 310 460 240 490 240" stroke="#9b8cff"/>
    <path d="M70 184 C70 60 450 40 490 160" stroke="#5ee0d0"/>
  </g>

  <!-- model panel -->
  <rect x="490" y="70" width="270" height="310" rx="14" fill="#0b1631" stroke="#6c96ff" stroke-opacity="0.35"/>
  <text x="512" y="102" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#6cc7ff" letter-spacing="1">PREDICTED % SILICA</text>
  <g stroke="#6c96ff" stroke-opacity="0.12"><line x1="512" y1="130" x2="740" y2="130"/><line x1="512" y1="165" x2="740" y2="165"/><line x1="512" y1="200" x2="740" y2="200"/></g>
  <polyline points="512,190 540,175 568,182 596,150 624,160 652,138 680,146 708,128 736,134" fill="none" stroke="#6cc7ff" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="512,195 540,170 568,188 596,156 624,152 652,142 680,140 708,132" fill="none" stroke="#f5a85a" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="512" y="240" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#9b8cff" letter-spacing="1">SHAP · FEATURE IMPACT</text>
  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#a3b0d4">
    <text x="512" y="268">air flow</text><rect x="590" y="258" width="140" height="12" rx="3" fill="#9b8cff"/>
    <text x="512" y="294">pulp pH</text><rect x="590" y="284" width="104" height="12" rx="3" fill="#9b8cff" fill-opacity="0.8"/>
    <text x="512" y="320">level</text><rect x="590" y="310" width="76" height="12" rx="3" fill="#9b8cff" fill-opacity="0.6"/>
    <text x="512" y="346">feed</text><rect x="590" y="336" width="46" height="12" rx="3" fill="#9b8cff" fill-opacity="0.45"/>
  </g>
  <rect x="560" y="398" width="200" height="30" rx="8" fill="#0b1631" stroke="#4ade80" stroke-opacity="0.6"/>
  <circle cx="578" cy="413" r="5" fill="#4ade80"/>
  <text x="592" y="418" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#e8eefc">FastAPI · LangGraph</text>
</svg>
