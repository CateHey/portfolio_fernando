<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2257"/>
      <stop offset="0.6" stop-color="#081634"/>
      <stop offset="1" stop-color="#050a1a"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc7ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dropClip"><path d="M560 70 C560 70 470 180 470 250 a90 90 0 0 0 180 0 C650 180 560 70 560 70 Z"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- topographic map -->
  <g fill="none" stroke="#6c96ff" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M-20 330 C80 280 150 360 260 310 S420 250 520 300"/>
    <path d="M-20 290 C70 240 160 310 250 270 S400 210 500 250"/>
    <path d="M-20 250 C60 200 170 260 240 230 S380 170 470 200"/>
    <path d="M-20 210 C50 160 160 210 230 190 S360 130 440 150"/>
    <path d="M-20 170 C60 120 150 160 220 150 S330 90 410 100"/>
    <path d="M-20 130 C60 80 140 110 210 110 S300 50 380 50"/>
  </g>
  <g stroke="#6c96ff" stroke-opacity="0.08">
    <line x1="0" y1="90" x2="440" y2="90"/><line x1="0" y1="180" x2="440" y2="180"/><line x1="0" y1="270" x2="440" y2="270"/><line x1="0" y1="360" x2="440" y2="360"/>
    <line x1="110" y1="0" x2="110" y2="450"/><line x1="220" y1="0" x2="220" y2="450"/><line x1="330" y1="0" x2="330" y2="450"/>
  </g>

  <!-- sampling points (lat/lon + date) -->
  <g>
    <g fill="#6cc7ff">
      <circle cx="70" cy="120" r="5"/><circle cx="160" cy="200" r="5"/><circle cx="250" cy="150" r="5"/>
      <circle cx="120" cy="300" r="5"/><circle cx="300" cy="260" r="5"/><circle cx="380" cy="330" r="5"/>
      <circle cx="210" cy="380" r="5"/><circle cx="350" cy="110" r="5"/>
    </g>
    <g fill="none" stroke="#6cc7ff" stroke-opacity="0.45">
      <circle cx="160" cy="200" r="14"/><circle cx="300" cy="260" r="14"/><circle cx="350" cy="110" r="14"/>
    </g>
    <g fill="#9b8cff"><circle cx="200" cy="250" r="4"/><circle cx="60" cy="380" r="4"/><circle cx="410" cy="200" r="4"/></g>
    <g fill="#5ee0d0"><circle cx="280" cy="60" r="4"/><circle cx="40" cy="220" r="4"/><circle cx="330" cy="410" r="4"/></g>
  </g>
  <!-- data flowing to the drop -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8">
    <path d="M300 260 C390 260 420 230 480 230" stroke="#6cc7ff"/>
    <path d="M350 110 C430 110 440 170 490 190" stroke="#9b8cff"/>
    <path d="M380 330 C440 330 460 290 490 280" stroke="#5ee0d0"/>
  </g>

  <!-- satellite -->
  <g transform="translate(150 40) rotate(-20)">
    <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#dbe8ff"/>
    <rect x="-52" y="-7" width="32" height="14" fill="#2f6bff" stroke="#6cc7ff"/>
    <rect x="20" y="-7" width="32" height="14" fill="#2f6bff" stroke="#6cc7ff"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#dbe8ff" stroke-width="2"/>
  </g>
  <path d="M160 70 L120 140 L200 140 Z" fill="#6cc7ff" fill-opacity="0.08"/>

  <!-- the drop with a chart inside -->
  <circle cx="560" cy="235" r="170" fill="url(#glow)"/>
  <path d="M560 70 C560 70 470 180 470 250 a90 90 0 0 0 180 0 C650 180 560 70 560 70 Z" fill="#0a1a44" stroke="url(#drop)" stroke-width="4"/>
  <g clip-path="url(#dropClip)">
    <path d="M460 300 L490 285 L515 292 L540 262 L565 270 L590 238 L615 246 L660 205 L660 360 L460 360 Z" fill="#2f6bff" fill-opacity="0.35"/>
    <polyline points="460,300 490,285 515,292 540,262 565,270 590,238 615,246 660,205" fill="none" stroke="#6cc7ff" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#ffffff"><circle cx="540" cy="262" r="4"/><circle cx="590" cy="238" r="4"/><circle cx="660" cy="205" r="4"/></g>
  </g>
  <path d="M515 205 a50 50 0 0 1 22 -45" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

  <!-- stat chips -->
  <rect x="620" y="70" width="150" height="56" rx="10" fill="#0b1631" stroke="#6c96ff" stroke-opacity="0.35"/>
  <text x="636" y="94" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#6cc7ff" letter-spacing="1">RECORDS</text>
  <text x="636" y="116" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">737 000+</text>
  <rect x="660" y="360" width="120" height="56" rx="10" fill="#0b1631" stroke="#9b8cff" stroke-opacity="0.45"/>
  <text x="676" y="384" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" fill="#9b8cff" letter-spacing="1">MLFLOW</text>
  <text x="676" y="406" font-family="Montserrat, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">9 runs</text>

  <g font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="1">
    <circle cx="28" cy="428" r="4" fill="#6cc7ff"/><text x="38" y="432" fill="#a3b0d4">SATELLITE</text>
    <circle cx="140" cy="428" r="4" fill="#9b8cff"/><text x="150" y="432" fill="#a3b0d4">CLIMATE</text>
    <circle cx="240" cy="428" r="4" fill="#5ee0d0"/><text x="250" y="432" fill="#a3b0d4">SOIL</text>
  </g>
</svg>
