<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#16306e"/>
      <stop offset="0.55" stop-color="#0a1736"/>
      <stop offset="1" stop-color="#050a1a"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b1a40"/>
      <stop offset="0.32" stop-color="#2f6bff"/>
      <stop offset="0.7" stop-color="#6cc7ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6cc7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6cc7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6c96ff" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="eyeClip">
      <path d="M150 225 Q400 40 650 225 Q400 410 150 225 Z"/>
    </clipPath>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6cc7ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6cc7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6cc7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="400" cy="225" r="230" fill="url(#glow)"/>

  <!-- eye outline -->
  <path d="M150 225 Q400 40 650 225 Q400 410 150 225 Z" fill="#081230" stroke="#6cc7ff" stroke-width="3"/>
  <g clip-path="url(#eyeClip)">
    <!-- iris -->
    <circle cx="400" cy="225" r="112" fill="url(#iris)"/>
    <g stroke="#dbe8ff" stroke-opacity="0.35" stroke-width="1.5">
      <line x1="400" y1="113" x2="400" y2="160"/><line x1="400" y1="290" x2="400" y2="337"/>
      <line x1="288" y1="225" x2="335" y2="225"/><line x1="465" y1="225" x2="512" y2="225"/>
      <line x1="321" y1="146" x2="354" y2="179"/><line x1="446" y1="271" x2="479" y2="304"/>
      <line x1="479" y1="146" x2="446" y2="179"/><line x1="354" y1="271" x2="321" y2="304"/>
    </g>
    <circle cx="400" cy="225" r="80" fill="none" stroke="#dbe8ff" stroke-opacity="0.35" stroke-dasharray="4 7"/>
    <!-- pupil -->
    <circle cx="400" cy="225" r="46" fill="#030712"/>
    <circle cx="383" cy="206" r="13" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="420" cy="243" r="5" fill="#ffffff" fill-opacity="0.6"/>
    <!-- scan band -->
    <rect x="150" y="150" width="500" height="70" fill="url(#scan)"/>
    <line x1="150" y1="185" x2="650" y2="185" stroke="#6cc7ff" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>

  <!-- detection box (YOLO) -->
  <g fill="none" stroke="#6cc7ff" stroke-width="3" stroke-linecap="round">
    <path d="M268 92 H238 V122"/><path d="M532 92 H562 V122"/>
    <path d="M268 358 H238 V328"/><path d="M532 358 H562 V328"/>
  </g>
  <rect x="238" y="62" width="178" height="26" rx="5" fill="#6cc7ff"/>
  <text x="250" y="80" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#04102e">YOLOv8 · eye 0.97</text>

  <!-- segmentation mask (SAM2) -->
  <circle cx="400" cy="225" r="114" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="2.5" stroke-dasharray="10 6"/>
  <rect x="452" y="364" width="110" height="26" rx="5" fill="#9b8cff"/>
  <text x="464" y="382" font-family="IBM Plex Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#0b0730">SAM2 mask</text>

  <!-- tracking points -->
  <g fill="#6cc7ff">
    <circle cx="150" cy="225" r="5"/><circle cx="650" cy="225" r="5"/>
    <circle cx="400" cy="133" r="4"/><circle cx="400" cy="317" r="4"/>
  </g>
  <g fill="none" stroke="#6cc7ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 5">
    <path d="M60 225 H140"/><path d="M660 225 H740"/>
  </g>
  <text x="40" y="420" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#7282ab" letter-spacing="2">OPENCV · DETECT · SEGMENT · TRACK</text>
  <circle cx="752" cy="36" r="6" fill="#4ade80"/>
  <text x="682" y="41" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" fill="#a3b0d4">LIVE</text>
</svg>
